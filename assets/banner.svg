<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070b14"/>
      <stop offset="50%" stop-color="#0d1527"/>
      <stop offset="100%" stop-color="#050811"/>
    </linearGradient>

    <!-- Emerald / Android Cyan Gradients -->
    <linearGradient id="neonCyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3DDC84"/>
      <stop offset="50%" stop-color="#00E5FF"/>
      <stop offset="100%" stop-color="#7C4DFF"/>
    </linearGradient>

    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3DDC84" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#00BCD4" stop-opacity="0.2"/>
    </linearGradient>

    <!-- Glassmorphic Card Fill -->
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.65"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.45"/>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <!-- Tech Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#334155" stroke-width="0.75" stroke-opacity="0.3"/>
      <circle cx="40" cy="40" r="1.5" fill="#38bdf8" fill-opacity="0.25"/>
    </pattern>
  </defs>

  <style>
    @keyframes pulseOrb {
      0%, 100% { transform: scale(1) translate(0, 0); opacity: 0.35; }
      50% { transform: scale(1.15) translate(20px, -15px); opacity: 0.65; }
    }
    @keyframes orbitNode {
      0% { transform: rotate(0deg) translateX(130px) rotate(0deg); }
      100% { transform: rotate(360deg) translateX(130px) rotate(-360deg); }
    }
    @keyframes floatCard {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-8px); }
    }
    @keyframes sweepLine {
      0% { transform: translateX(-1200px); }
      100% { transform: translateX(1200px); }
    }
    @keyframes signalPulse {
      0% { r: 4; opacity: 1; }
      100% { r: 24; opacity: 0; }
    }
    .orb-1 { animation: pulseOrb 8s ease-in-out infinite; }
    .orb-2 { animation: pulseOrb 10s ease-in-out infinite reverse; }
    .floating-badge { animation: floatCard 6s ease-in-out infinite; }
    .radar-sweep { animation: sweepLine 7s linear infinite; }
    .pulse-ring { animation: signalPulse 3s cubic-bezier(0.2, 0.8, 0.2, 1) infinite; }
  </style>

  <!-- Deep Canvas Background -->
  <rect width="1200" height="420" rx="16" fill="url(#bgGrad)"/>

  <!-- Matrix Grid -->
  <rect width="1200" height="420" rx="16" fill="url(#grid)"/>

  <!-- Dynamic Glowing Background Orbs (Behind content) -->
  <g opacity="0.6">
    <circle class="orb-1" cx="220" cy="110" r="160" fill="#3DDC84" filter="url(#glow)" opacity="0.3"/>
    <circle class="orb-2" cx="980" cy="310" r="210" fill="#7C4DFF" filter="url(#glow)" opacity="0.35"/>
    <circle class="orb-1" cx="1060" cy="90" r="140" fill="#00E5FF" filter="url(#glow)" opacity="0.3"/>
  </g>

  <!-- Futuristic Animated Accent Ring on Right Side -->
  <g transform="translate(1010, 210)" opacity="0.45">
    <circle cx="0" cy="0" r="140" fill="none" stroke="#1e293b" stroke-width="2"/>
    <circle cx="0" cy="0" r="110" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="6, 10"/>
    <circle cx="0" cy="0" r="80" fill="none" stroke="#3DDC84" stroke-width="1.5" stroke-dasharray="8, 6"/>
    <!-- Orbiting Android Virtualization Node -->
    <g style="animation: orbitNode 14s linear infinite;">
      <circle cx="0" cy="0" r="8" fill="#3DDC84" filter="url(#softGlow)"/>
      <circle class="pulse-ring" cx="0" cy="0" r="8" fill="none" stroke="#3DDC84" stroke-width="2"/>
    </g>
    <!-- Center Virtualization Core -->
    <circle cx="0" cy="0" r="32" fill="#0f172a" stroke="#00E5FF" stroke-width="2"/>
    <!-- Bugdroid Antennae Icon inside Core -->
    <path d="M -12 -2 A 12 12 0 0 1 12 -2 Z" fill="#3DDC84"/>
    <circle cx="-5" cy="-8" r="1.5" fill="#070b14"/>
    <circle cx="5" cy="-8" r="1.5" fill="#070b14"/>
    <line x1="-8" y1="-10" x2="-13" y2="-15" stroke="#3DDC84" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="8" y1="-10" x2="13" y2="-15" stroke="#3DDC84" stroke-width="1.5" stroke-linecap="round"/>
  </g>

  <!-- Foreground Title and Content (Highest Z-index, perfectly legible) -->
  <g transform="translate(70, 75)">
    <!-- Top Pill Badge -->
    <g class="floating-badge">
      <rect x="0" y="0" width="370" height="32" rx="16" fill="url(#cardGrad)" stroke="#3DDC84" stroke-width="1.2" stroke-opacity="0.8"/>
      <circle cx="16" cy="16" r="4" fill="#3DDC84" filter="url(#softGlow)"/>
      <text x="32" y="21" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#3DDC84" letter-spacing="1.5">CURATED ECOSYSTEM • 2026 EDITION</text>
    </g>

    <!-- Main Title -->
    <text x="0" y="95" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="44" font-weight="900" fill="#FFFFFF" letter-spacing="-0.5">
      Android APK Launchers
    </text>
    <text x="0" y="145" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="44" font-weight="900" fill="url(#neonCyan)" letter-spacing="-0.5">
      &amp; Emulation Setups 🚀
    </text>

    <!-- Subtitle -->
    <text x="0" y="195" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#94A3B8" letter-spacing="0.2">
      High-performance SaaS emulators, containerized runtimes &amp; open-source virtualization
    </text>
    <text x="0" y="222" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#64748B">
      Featuring BlueStacks, Genymotion, scrcpy, Waydroid, Redroid, Docker-Android &amp; more.
    </text>

    <!-- Feature Feature Tag Pills in Foreground -->
    <g transform="translate(0, 255)">
      <!-- Pill 1: Virtualization -->
      <g>
        <rect x="0" y="0" width="135" height="34" rx="8" fill="#1e293b" fill-opacity="0.8" stroke="#334155" stroke-width="1"/>
        <text x="18" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#38BDF8">⚡ Virtualization</text>
      </g>
      <!-- Pill 2: Containers -->
      <g transform="translate(147, 0)">
        <rect x="0" y="0" width="135" height="34" rx="8" fill="#1e293b" fill-opacity="0.8" stroke="#334155" stroke-width="1"/>
        <text x="18" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#3DDC84">🐳 Containers</text>
      </g>
      <!-- Pill 3: APK Launchers -->
      <g transform="translate(294, 0)">
        <rect x="0" y="0" width="145" height="34" rx="8" fill="#1e293b" fill-opacity="0.8" stroke="#334155" stroke-width="1"/>
        <text x="18" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#A855F7">📦 APK Launchers</text>
      </g>
      <!-- Pill 4: Cloud CI/CD -->
      <g transform="translate(451, 0)">
        <rect x="0" y="0" width="135" height="34" rx="8" fill="#1e293b" fill-opacity="0.8" stroke="#334155" stroke-width="1"/>
        <text x="18" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#F59E0B">☁️ Cloud CI/CD</text>
      </g>
    </g>
  </g>

  <!-- Border Gradient Stroke around Card -->
  <rect x="1" y="1" width="1198" height="418" rx="15" fill="none" stroke="url(#accentGrad)" stroke-width="1.5" stroke-opacity="0.5"/>
</svg>